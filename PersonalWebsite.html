<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Social Website</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* CSS Variables for Theming */
        :root {
            --primary-color: #2185d6;
            --secondary-color: #28096b;
            --accent-color: #fdf906;
            --transition-duration: 0.4s;
            --background-dark: #111111;
            --background-light: #f5f5f5;
            --text-dark: #fff; /* White text in dark mode */
            --text-light: #000; /* Black text in light mode */
            --button-border-dark: #a2a2a2; /* Button border color in dark mode */
            --button-border-light: #000; /* Button border color in light mode */
            --button-bg-hover-dark: #bebebe; /* Button hover background in dark mode */
            --button-bg-hover-light: #000; /* Button hover background in light mode */
            --button-text-hover-dark: #111; /* Button hover text color in dark mode */
            --button-text-hover-light: #fff; /* Button hover text color in light mode */
        }

        /* Page Background Pattern */
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-dark);
            background-image: linear-gradient(
                32deg,
                rgba(8, 8, 8, 0.74) 30px,
                transparent
            );
            background-size: 60px 60px;
            background-position: -5px -5px;
            color: var(--text-dark); /* Default text color (white) */
            text-align: center;
            transition: background var(--transition-duration) ease-in-out, color var(--transition-duration) ease-in-out;
        }

        /* Light Mode Background and Text Color */
        .light-mode {
            background: var(--background-light); /* Plain light background */
            color: var(--text-light); /* Black text in light mode */
        }

        /* Toggle Switch */
        .toggle-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        .switch {
            font-size: 17px;
            position: relative;
            display: inline-block;
            width: 3.5em;
            height: 2em;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            background-color: var(--primary-color);
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            cursor: pointer;
            transition: var(--transition-duration);
            border-radius: 30px;
        }

        .slider::before {
            position: absolute;
            content: "";
            height: 1.4em;
            width: 1.4em;
            border-radius: 50%;
            left: 10%;
            bottom: 15%;
            box-shadow: inset 15px -4px 0px 15px var(--accent-color);
            background-color: var(--secondary-color);
            transition: all var(--transition-duration) ease;
        }

        .clouds_stars {
            position: absolute;
            border-radius: 50%;
            height: 10px;
            width: 10px;
            left: 70%;
            bottom: 50%;
            background-color: #fff;
            transition: all var(--transition-duration) ease;
            opacity: 1;
        }

        .switch input:checked ~ .clouds_stars {
            transform: translateX(-20px) scale(0.5);
            opacity: 0.8;
            box-shadow: -7px 10px 0 #fff, 8px 15px 0 #fff, -17px 1px 0 #fff;
        }

        .switch input:checked + .slider {
            background-color: var(--secondary-color) !important;
        }

        .switch input:checked + .slider::before {
            transform: translateX(100%);
            box-shadow: inset 8px -4px 0 0 #fff;
        }

        /* Container Styling */
        .container {
            max-width: 90%; /* Adjusted for smaller screens */
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
            transition: background var(--transition-duration) ease-in-out;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3); /* Added shadow */
        }

        /* Dark Mode Container Background */
        body:not(.light-mode) .container {
            --s: 200px; /* control the size */
            --c1: #1d1d1d;
            --c2: #4e4f51;
            --c3: #3c3c3c;

            background: repeating-conic-gradient(
                    from 30deg,
                    #0000 0 120deg,
                    var(--c3) 0 180deg
                )
                calc(0.5 * var(--s)) calc(0.5 * var(--s) * 0.577),
            repeating-conic-gradient(
                from 30deg,
                var(--c1) 0 60deg,
                var(--c2) 0 120deg,
                var(--c3) 0 180deg
            );
            background-size: var(--s) calc(var(--s) * 0.577);
        }

        /* Light Mode Container Background */
        .light-mode .container {
            --s: 82px; /* control the size */
            --c1: #b2b2b2;
            --c2: #ffffff;
            --c3: #d9d9d9;

            --_g: var(--c3) 0 120deg, #0000 0;
            background: conic-gradient(from -60deg at 50% calc(100% / 3), var(--_g)),
                conic-gradient(from 120deg at 50% calc(200% / 3), var(--_g)),
                conic-gradient(
                    from 60deg at calc(200% / 3),
                    var(--c3) 60deg,
                    var(--c2) 0 120deg,
                    #0000 0
                ),
                conic-gradient(from 180deg at calc(100% / 3), var(--c1) 60deg, var(--_g)),
                linear-gradient(
                    90deg,
                    var(--c1) calc(100% / 6),
                    var(--c2) 0 50%,
                    var(--c1) 0 calc(500% / 6),
                    var(--c2) 0
                );
            background-size: calc(1.732 * var(--s)) var(--s);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.2rem;
            color: inherit; /* Inherits the body text color */
        }

        .social-links {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px; /* Added gap for spacing between buttons */
        }

        /* Sleek Button Styles */
        button {
            padding: 0.8em 1.8em;
            border: 2px solid var(--button-border-dark);
            position: relative;
            overflow: hidden;
            background-color: transparent;
            text-align: center;
            text-transform: uppercase;
            font-size: 16px;
            transition: .3s;
            z-index: 1;
            font-family: inherit;
            color: var(--text-dark);
            cursor: pointer;
            width: 100%; /* Full width on smaller screens */
            max-width: 300px; /* Max width for larger screens */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button::before {
            content: '';
            width: 0;
            height: 1000%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            background: var(--button-bg-hover-dark);
            transition: .5s ease;
            display: block;
            z-index: -1;
        }

        button:hover::before {
            width: 105%;
        }

        button:hover {
            color: var(--button-text-hover-dark);
        }

        /* Light Mode Button Styles */
        .light-mode button {
            border-color: var(--button-border-light);
            color: var(--text-light);
        }

        .light-mode button::before {
            background: var(--button-bg-hover-light);
        }

        .light-mode button:hover {
            color: var(--button-text-hover-light);
        }

        /* Social Media Icons */
        .icon {
            width: 20px;
            height: 20px;
            margin-right: 8px; /* Added margin for spacing between icon and text */
        }

        /* Media Queries for Responsiveness */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem; /* Smaller font size for mobile */
            }

            p {
                font-size: 1rem; /* Smaller font size for mobile */
            }

            .container {
                padding: 15px; /* Reduced padding for smaller screens */
            }

            button {
                font-size: 14px; /* Smaller font size for buttons */
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem; /* Even smaller font size for very small screens */
            }

            p {
                font-size: 0.9rem; /* Even smaller font size for very small screens */
            }

            .toggle-container {
                top: 10px;
                right: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Toggle Button -->
    <div class="toggle-container">
        <label class="switch" aria-label="Toggle dark mode">
            <input type="checkbox" id="themeToggle" aria-checked="false">
            <span class="slider"></span>
            <span class="clouds_stars" aria-hidden="true"></span>
        </label>
    </div>

    <div class="container">
        <h1>Welcome to My Personal Website</h1>
        <p>Hi, I'm Altamas Khan! Connect with me on social media.</p>
        <div class="social-links">
            <button onclick="window.open('https://instagram.com/just.the.guy.ak', '_blank')">
                <img class="icon" src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="Instagram">
                <span>Instagram (Personal)</span>
            </button>

            <button onclick="window.open('https://instagram.com/shutter.up.ak', '_blank')">
                <img class="icon" src="https://cdn-icons-png.flaticon.com/512/1042/1042339.png" alt="Camera">
                <span>Instagram</span>
            </button>

            <button onclick="window.open('https://instagram.com/wearbold.in', '_blank')">
                <img class="icon" src="https://cdn-icons-png.flaticon.com/512/2357/2357127.png" alt="Clothes Hanger">
                <span>WearBold</span>
            </button>

            <button onclick="window.open('https://www.snapchat.com/add/justtheguyak', '_blank')">
                <img class="icon" src="https://cdn-icons-png.flaticon.com/512/3670/3670166.png" alt="Snapchat">
                <span>Snapchat</span>
            </button>

            <button onclick="window.open('https://t.me/yeahjustak', '_blank')">
                <img class="icon" src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png" alt="Telegram">
                <span>Telegram</span>
            </button>
        </div>
    </div>

    <script>
        const themeToggle = document.getElementById("themeToggle");
        themeToggle.addEventListener("change", () => {
            document.body.classList.toggle("light-mode", themeToggle.checked);
            themeToggle.setAttribute("aria-checked", themeToggle.checked);
        });
    </script>
</body>
</html>
